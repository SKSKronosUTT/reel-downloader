<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador de Reels - Facebook</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📱 Descargador de Reels</h1>
            <p class="subtitle">Pega el enlace de un Reel de Facebook para descargarlo</p>
            
            <div id="mainScreen">
                <div class="input-group">
                    <input type="text" id="urlInput" placeholder="https://www.facebook.com/share/v/..." />
                    <button id="pasteBtn" class="btn-paste" title="Pegar desde portapapeles">
                        📋
                    </button>
                </div>
                
                <button id="downloadBtn" class="btn-download">
                    ⬇️ Descargar
                </button>
                
                <div id="loadingSpinner" class="spinner" style="display: none;">
                    <div class="spinner-circle"></div>
                    <p>Descargando video...</p>
                </div>
            </div>
            
            <div id="successScreen" style="display: none;">
                <div class="success-icon">✅</div>
                <h2 class="success-title">Descarga exitosa</h2>
                <p class="success-message">El video se ha guardado en tu carpeta de descargas</p>
                <button id="backBtn" class="btn-back">⬅️ Descargar otro video</button>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlInput = document.getElementById('urlInput');
            const pasteBtn = document.getElementById('pasteBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const mainScreen = document.getElementById('mainScreen');
            const successScreen = document.getElementById('successScreen');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const backBtn = document.getElementById('backBtn');

            // Función para pegar desde portapapeles
            pasteBtn.addEventListener('click', async function() {
                try {
                    const text = await navigator.clipboard.readText();
                    urlInput.value = text;
                    urlInput.style.borderColor = '#66a3ff';
                    setTimeout(() => {
                        urlInput.style.borderColor = '#ccc';
                    }, 2000);
                } catch (err) {
                    alert('No se pudo acceder al portapapeles. Por favor, pega el enlace manualmente.');
                }
            });

            // Función para mostrar/ocultar estados
            function showLoading() {
                mainScreen.style.display = 'none';
                successScreen.style.display = 'none';
                loadingSpinner.style.display = 'block';
            }

            function showMainScreen() {
                mainScreen.style.display = 'block';
                successScreen.style.display = 'none';
                loadingSpinner.style.display = 'none';
                urlInput.value = '';
                downloadBtn.disabled = false;
            }

            function showSuccess() {
                mainScreen.style.display = 'none';
                successScreen.style.display = 'block';
                loadingSpinner.style.display = 'none';
            }

            // Función para descargar
            downloadBtn.addEventListener('click', async function() {
                const url = urlInput.value.trim();
                
                if (!url) {
                    alert('Por favor, pega un enlace de Facebook Reel');
                    return;
                }

                // Validar que sea una URL de Facebook
                if (!url.includes('facebook.com') && !url.includes('fb.watch')) {
                    alert('Por favor, ingresa una URL válida de Facebook');
                    return;
                }

                showLoading();

                try {
                    const response = await fetch('/download', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ url: url })
                    });

                    const data = await response.json();

                    if (data.success) {
                        showSuccess();
                    } else {
                        alert('Error: ' + (data.error || 'No se pudo descargar el video'));
                        showMainScreen();
                    }
                } catch (error) {
                    alert('Error al conectar con el servidor: ' + error.message);
                    showMainScreen();
                }
            });

            // Botón para regresar
            backBtn.addEventListener('click', function() {
                showMainScreen();
            });

            // Permitir descargar con Enter
            urlInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    downloadBtn.click();
                }
            });

            // Validar URL mientras se escribe
            urlInput.addEventListener('input', function() {
                const url = this.value.trim();
                if (url && (url.includes('facebook.com') || url.includes('fb.watch'))) {
                    this.style.borderColor = '#66a3ff';
                } else {
                    this.style.borderColor = '#ccc';
                }
            });
        });
    </script>
</body>
</html>
